<title>Ori, the Origin Labs mascot</title>
<style>
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.wink{transform-box:fill-box;transform-origin:center;animation:wink 3.8s infinite}
@keyframes wink{0%,55%,85%,100%{transform:scaleY(1)}62%,78%{transform:scaleY(.08)}}
.brow{transform-box:fill-box;transform-origin:center;animation:brow 4.6s ease-in-out infinite}
@keyframes brow{0%,55%,100%{transform:translateY(0) rotate(0)}65%,82%{transform:translateY(-7px) rotate(-4deg)}}
.jab{animation:jab 1.5s ease-in-out infinite}
@keyframes jab{0%,100%{transform:translate(0,0)}45%{transform:translate(-8px,2px)}}
.tap{animation:tap 1.5s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,3px)}}
.wave{transform-origin:288px 236px;animation:wave 1.3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.thumb{animation:thumb 1.2s ease-in-out infinite}
@keyframes thumb{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sway{transform-origin:210px 440px;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
